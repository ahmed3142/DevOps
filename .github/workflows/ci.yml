name: CI

on:
  push:
    branches: ["main", "feature/**"]
    tags: ["v*"]
  pull_request:
    branches: ["main"]

jobs:
  build-test:
    name: Lint, test and build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Run unit tests
        run: npm test

      - name: Production build
        run: npm run build
